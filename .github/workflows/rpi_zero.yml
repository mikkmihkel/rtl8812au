name: Raspberry Pi Driver Build

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Target kernel version (e.g., 6.12.25+rpt-rpi-v8)'
        required: true
        default: '6.12.25+rpt-rpi-v8'

jobs:
  build_pi_zero_2w_driver:
    runs-on: ubuntu-22.04
    name: Build RTL8812AU driver for RPi Zero 2W
    steps:
    - uses: actions/checkout@v4

    - name: Download rtl8812au driver source
      run: |
        git clone -b v5.6.4.2 https://github.com/aircrack-ng/rtl8812au.git

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git bc make curl gnupg2
        sudo apt-get install -y crossbuild-essential-arm64

    - name: Download Raspberry Pi Kernel Source
      run: |
        # The user's kernel is 6.12.25, so we get the corresponding rpi-6.12.y branch
        git clone --depth=1 --branch rpi-6.12.y https://github.com/raspberrypi/linux.git

    - name: Prepare Kernel for Module Building
      run: |
        cd linux
        # Configure for RPi Zero 2W (bcm2711 chipset)
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- bcm2711_defconfig
        # Prepare the scripts and headers for external module compilation
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare

    - name: Build Driver Against Kernel Source
      id: build_driver
      run: |
        cd rtl8812au

        # Configure Makefile for ARM64 Raspberry Pi
        sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/g' Makefile
        sed -i 's/CONFIG_PLATFORM_ARM64_RPI = n/CONFIG_PLATFORM_ARM64_RPI = y/g' Makefile

        # Set ARM64 environment
        export ARCH=arm64
        sed -i 's/^MAKE="/MAKE="ARCH=arm64\ /' dkms.conf

        # Set the target kernel version for the module's 'vermagic' string
        TARGET_KERNEL="${{ github.event.inputs.kernel_version }}"
        echo "Building for kernel version: $TARGET_KERNEL"

        # Point to the downloaded kernel source directory
        KERNEL_SRC_DIR=$(realpath ../linux)
        echo "Using kernel source from: $KERNEL_SRC_DIR"

        # Build the driver, pointing KSRC to the downloaded source
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KVER="$TARGET_KERNEL" KSRC="$KERNEL_SRC_DIR" -j$(nproc)

        echo "kernel_version=$TARGET_KERNEL" >> $GITHUB_OUTPUT

    - name: Prepare Artifact
      run: |
        mkdir -p build/
        DRIVER_NAME="88XXau.ko"
        if [ ! -f rtl8812au/$DRIVER_NAME ]; then
          DRIVER_NAME="8812au.ko"
        fi
        cp rtl8812au/$DRIVER_NAME "build/${{ steps.build_driver.outputs.kernel_version }}_${DRIVER_NAME}"
        cp rtl8812au/README.md "build/README-driver.md"
        
        # Create a README for the artifact
        cat > build/README.txt << 'README_EOF'
        RTL8812AU Driver Build
        ======================
        
        Built for kernel: ${{ steps.build_driver.outputs.kernel_version }}
        Source: https://github.com/aircrack-ng/rtl8812au v5.6.4.2
        
        Installation:
        1. Copy the .ko file to your Raspberry Pi
        2. Follow installation instructions from the driver's README
        README_EOF

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rtl8812au-driver-${{ steps.build_driver.outputs.kernel_version }}
        path: build/ 

name: Raspberry Pi Zero 2 W RTL8812AU Build

on:
  workflow_dispatch:

jobs:
  build-zero2:
    runs-on: ubuntu-latest
    env:
      PIVER: 6.12.25+rpt-rpi-v8
    steps:
    - uses: actions/checkout@v4

    - name: Install cross-toolchain & helpers
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-aarch64-linux-gnu bc wget tar make

    - name: Fetch Pi Zero 2 W kernel headers
      run: |
        # download the exact headers tarball from the official firmware repo
        wget -qO- https://github.com/raspberrypi/firmware/raw/${PIVER}/headers.tar.xz \
          | sudo tar -xJf - -C /lib/modules/${PIVER}
        # now /lib/modules/${PIVER}/build contains the headers

    - name: Build RTL8812AU driver
      run: |
        # apply the Pi-Zero-2 w patch to the Makefile
        sed -i 's/CONFIG_PLATFORM_ARM64_RPI = n/CONFIG_PLATFORM_ARM64_RPI = y/' Makefile

        # clean & compile
        make clean
        make ARCH=arm64 \
             CROSS_COMPILE=aarch64-linux-gnu- \
             KVER=${PIVER} \
             KSRC=/lib/modules/${PIVER}/build \
             modules -j$(nproc)

      # this step will generate 88XXau.ko in the repo root

    - name: Upload .ko artifact
      uses: actions/upload-artifact@v4
      with:
        name: rtl8812au-${{ env.PIVER }}-arm64
        path: 88XXau.ko
